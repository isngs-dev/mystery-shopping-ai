# Only used when Netlify builds from a Git repository whose base directory is "frontend".
# For a drag-and-drop deploy, drop the contents of frontend/dist instead (see ../DEPLOY.md).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The API is NOT hosted by Netlify. After the backend has a public HTTPS address, add this rule ABOVE the one above so that
# /api calls reach it and the login cookie stays same-origin:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOST/api/:splat"
#   status = 200
#   force = true

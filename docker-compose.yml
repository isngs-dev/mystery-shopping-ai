# Production-like stack: PostgreSQL + the app (API + built SPA). Put a TLS-terminating proxy in front.
# Provide secrets via a .env file next to this file (see .env.example). Never commit real secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: msai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: msai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msai"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://msai:${POSTGRES_PASSWORD}@db:5432/msai
      STORAGE_ROOT: /data/storage
      COOKIE_SECURE: "true"
    volumes: [docs:/data]
    ports: ["8000:8000"]

volumes:
  pgdata:
  docs:
